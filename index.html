<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <main>
      <div class="flex-wrapper">
      <div class="flex-container">
        <div class="flex-item">
          <img class="flex-picture" src="images/image_1.png" alt="watch" />
          <p class="flex-descriptions">Непрерывная работа c 2017 года</p>
        </div>
        <div class="flex-item">
          <img
            class="flex-picture"
            src="images/image_2.png"
            alt="certificate"
          />
          <p class="flex-descriptions">Вся продукция сертифицирована</p>
        </div>
        <div class="flex-item">
          <img class="flex-picture" src="images/image_3.png" alt="control" />
          <p class="flex-descriptions">Контроль качества на всех этапах</p>
        </div>
        <div class="flex-item">
          <img class="flex-picture" src="images/image_4.png" alt="cars" />
          <p class="flex-descriptions">Возможны поставки по всей стране</p>
        </div>
        <div class="flex-item">
          <img class="flex-picture" src="images/image_5.png" alt="speed" />
          <p class="flex-descriptions">Оперативное производство</p>
        </div>
      </div>
      </div>
    </main>
  </body>
</html>
